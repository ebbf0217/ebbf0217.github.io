<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>퍼스널 쇼퍼 대행사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --ink:#2A211C; --paper:#FFF9EE; --wood:#E9C58F; --wood-d:#B8875A; --teal:#12A08A; --teal-d:#0B6F60;
  --red:#E5484D; --yellow:#FFC93C; --yellow-d:#E0A100; --sky:#BFE6F2; --mint:#D9F2E6; --line:#2A211C;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Jua",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1E2B2A;color:var(--ink);font-family:var(--body);overscroll-behavior:none}
body{display:flex;justify-content:center}
#game{position:relative;width:100%;max-width:480px;height:100%;height:100dvh;overflow:hidden;background:#F4E7CF;
  user-select:none;-webkit-user-select:none;touch-action:none}
canvas#world{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;display:flex;align-items:center;gap:6px;
  font-family:var(--display);font-size:18px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.pill .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2.5px solid var(--line);font-family:var(--display)}
.ico.coin{background:var(--yellow)} .ico.clock{background:var(--sky)} .ico.won{background:var(--mint)}
.timer.hurry{animation:hurry .5s infinite alternate;background:#FFE1E1}
@keyframes hurry{to{transform:scale(1.08)}}
.spacer{flex:1}
.custbar{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.face{width:54px;height:54px;border-radius:14px;border:3px solid var(--line);background:var(--mint) center/cover no-repeat;flex:none;box-shadow:0 3px 0 var(--line)}
.memo{background:var(--paper);border:3px solid var(--line);border-radius:14px;padding:6px 10px;font-size:13px;line-height:1.35;box-shadow:0 3px 0 var(--line);min-width:0}
.memo b{font-family:var(--display);font-weight:400;font-size:15px}
.cartchip{margin-top:2px;display:inline-block;background:var(--yellow);border:2px solid var(--line);border-radius:8px;padding:0 6px;font-weight:700;font-size:12px}

/* ---------- Controls ---------- */
.controls{position:absolute;left:0;right:0;bottom:0;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
.stick{width:128px;height:128px;border-radius:50%;background:rgba(255,249,238,.55);border:3px solid rgba(42,33,28,.55);position:relative;pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--paper);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.abtn{pointer-events:auto;width:104px;height:104px;border-radius:50%;border:4px solid var(--line);background:var(--teal);color:#fff;font-family:var(--display);font-size:20px;line-height:1.1;
  box-shadow:0 6px 0 var(--line);display:grid;place-items:center;text-align:center;padding:8px;cursor:pointer}
.abtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.abtn.off{background:#B9B2A6;color:#5f574f}
.abtn.pay{background:var(--red)}

/* ---------- Overlays ---------- */
.layer{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(to top,rgba(30,43,42,.75),rgba(30,43,42,.15) 70%)}
.layer.center{justify-content:center;background:rgba(30,43,42,.62)}
.sheet{background:var(--paper);border:4px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(18px) scale(.97);opacity:.4}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.15}
.sheet p{margin:0;line-height:1.5}
.small{font-size:13px;color:#6B5F55}
.btn{font-family:var(--display);font-size:21px;border:4px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--line);cursor:pointer;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.btn:disabled{background:#B9B2A6;color:#6b635b;cursor:not-allowed}
.btn.sub{background:var(--paper);color:var(--ink)}
.btn.warn{background:var(--red)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.price{font-family:var(--display);font-size:18px;background:var(--yellow);border:3px solid var(--line);border-radius:10px 6px 6px 10px;padding:1px 10px;white-space:nowrap}

.title-art{height:190px;border:4px solid var(--line);border-radius:18px;background:#9ED8C9 center/cover no-repeat;position:relative;overflow:hidden}
.logo{font-family:var(--display);font-size:40px;line-height:1.05;margin:0;color:var(--ink);text-shadow:0 3px 0 #fff}
.logo small{display:block;font-size:16px;color:var(--teal-d);text-shadow:none;letter-spacing:.06em}

.speaker{display:flex;gap:12px;align-items:flex-start}
.portrait{width:96px;height:96px;flex:none;border:4px solid var(--line);border-radius:18px;background:var(--mint) center/cover no-repeat}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 12px;font-size:15px;line-height:1.5;min-height:72px}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right-color:var(--line)}
.who{font-family:var(--display);font-size:18px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{font-family:var(--body);font-weight:700;font-size:14px;text-align:left;padding:10px;border:3px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip.on{background:var(--yellow)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

.goods{display:flex;gap:12px;align-items:center}
.gimg{width:84px;height:84px;flex:none;border:3px solid var(--line);border-radius:16px;background:#fff center/contain no-repeat}
.facts{margin:0;padding-left:1.1em;font-size:15px;line-height:1.55}
.review{background:#fff;border:2px dashed #b9ab98;border-radius:12px;padding:8px 10px;font-size:14px}
.over{color:var(--red);font-weight:900}

.score-list{display:flex;flex-direction:column;gap:6px;font-size:15px}
.score-list .row{border-bottom:2px dashed #e0d3bf;padding-bottom:6px}
.score-list b{font-family:var(--display);font-weight:400;font-size:19px}
.total{font-family:var(--display);font-size:40px;color:var(--teal-d);text-align:center;line-height:1}
.later{background:var(--mint);border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.stars{font-size:34px;letter-spacing:3px;text-align:center;color:var(--yellow-d);-webkit-text-stroke:2px var(--line)}
.stars .off{color:#E6DCCB}

input.name{font-family:var(--display);font-size:22px;border:4px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;background:#fff;color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700}
.rank li.me{background:var(--yellow)}
.rank .no{font-family:var(--display);font-size:20px;text-align:center}
.rank .pt{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}

.float{position:absolute;z-index:8;font-family:var(--display);font-size:24px;color:#fff;-webkit-text-stroke:1.5px var(--line);pointer-events:none;animation:up 1s ease-out forwards}
@keyframes up{to{transform:translateY(-46px);opacity:0}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:9;font-family:var(--display);font-size:46px;color:#fff;-webkit-text-stroke:3px var(--line);white-space:nowrap;pointer-events:none;animation:ban 1.1s ease-out forwards}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.4)}25%{transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;bottom:170px;transform:translateX(-50%);z-index:9;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;white-space:nowrap}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.howto-img{aspect-ratio:4/3;border:4px solid var(--line);border-radius:18px;background:#DDEFE8 center/cover no-repeat;position:relative;overflow:hidden}
.howto-img .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#6B5F55}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:#E0D3BF;border:2px solid var(--line)}
.dots i.on{background:var(--teal);width:26px;border-radius:99px}
.btnrow{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.skip{align-self:center;background:none;border:0;font-family:var(--body);font-size:14px;color:#6B5F55;text-decoration:underline;cursor:pointer;padding:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="game">
  <canvas id="world"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="pill timer" id="timer"><span class="ico clock">⏱</span><span id="sec">40</span></div>
    <div class="pill"><span class="ico won">₩</span><span id="budget">0</span></div>
    <div class="spacer"></div>
    <div class="pill"><span class="ico coin">P</span><span id="score">0</span></div>
    <button class="pill" id="mute" style="pointer-events:auto;cursor:pointer;padding:4px 10px;font-family:var(--display)" aria-label="배경음악 끄기">♪</button>
  </div>
  <div class="custbar" id="custbar" hidden>
    <div class="face" id="miniFace"></div>
    <div class="memo"><b id="memoWho"></b><br><span id="memoCrit"></span><br><span class="cartchip" id="cartChip">장바구니 비어 있음</span></div>
  </div>

  <div class="controls" id="controls" hidden>
    <div class="stick" id="stick" aria-label="조이스틱"><i id="knob"></i></div>
    <button class="abtn off" id="abtn">진열대로</button>
  </div>

  <div id="layer"></div>
</div>

<script>
/* =========================================================
   설정
   ========================================================= */
// 새 Supabase 프로젝트의 Project URL과 publishable key를 넣으면 반 전체 랭킹이 켜진다. 비어 있으면 기기별 랭킹.
const SUPABASE_URL = 'https://ukgdfdnmtqivayzjnkbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_PoU-Jfm98dsvjRYfqfG-wQ_5GQi1D5S';
const TABLE = 'shopper_rankings';
const SHOP_TIME = 40;          // 손님 한 명당 쇼핑 제한 시간(초)
const LOCAL_KEY = 'shopper_rank_local';
const TIME_BONUS = 30;        // 남은 시간 1초당 점수 (빨리 끝낼수록 높음)

/* =========================================================
   데이터
   ========================================================= */
const CRIT = {price:'가격이 싼가?', tough:'튼튼한가?', light:'가볍고 들기 편한가?', design:'디자인이 예쁜가?', func:'기능이 많은가?', eco:'환경에 도움이 되는가?'};
const CUSTOMERS = [
  { id:'minjun', who:'축구부 동생 민준', item:'운동화', budget:30000, want:['tough','price'],
    say:['형, 누나! 나 운동장에서 매일 축구해서 운동화가 금방 닳아.','용돈 모아서 사는 거라 아껴 써야 해. 부탁할게!'],
    color:'#3B7DDD', goods:[
      {id:'shoe_char', n:'캐릭터 운동화', p:25000, c:'#F28AB2', info:['좋아하는 캐릭터가 그려져 있다','밑창에 불이 들어온다'], r:'예쁜데 두 달 만에 밑창이 떨어졌어요.', a:{tough:1,light:2,design:3,func:2,eco:1}, later:'두 달 뒤, 밑창이 떨어져서 축구를 못 하게 됐어요.'},
      {id:'shoe_soccer', n:'튼튼한 축구 운동화', p:28000, c:'#3E8E41', info:['밑창이 두껍고 질기다','발목을 잘 잡아 준다'], r:'1년째 매일 뛰는데 멀쩡해요.', a:{tough:3,light:2,design:2,func:3,eco:1}, later:'두 달 뒤, 매일 축구해도 멀쩡해요. 대신 용돈이 거의 남지 않았대요.'},
      {id:'shoe_basic', n:'기본 운동화', p:15000, c:'#9AA5AB', info:['평범한 디자인','적당히 튼튼하다'], r:'가격에 비해 오래 신었어요.', a:{tough:2,light:2,design:1,func:1,eco:2}, later:'두 달 뒤, 조금 닳았지만 잘 신고 있어요. 남은 돈으로 축구공도 샀대요.'},
      {id:'shoe_limited', n:'한정판 운동화', p:45000, c:'#7B4FD6', info:['유명 선수가 광고한다','한정 수량만 판다'], r:'멋있어요. 친구들이 다 부러워해요.', a:{tough:3,light:3,design:3,func:3,eco:1}, later:''},
    ]},
  { id:'grandma', who:'시장 가시는 순자 할머니', item:'장바구니', budget:20000, want:['light','tough'],
    say:['아이고, 무릎이 아파서 무거운 걸 들고 다니기가 힘들구나.','시장에 매일 갈 거라 오래오래 쓸 수 있으면 좋겠어.'],
    color:'#B5546A', goods:[
      {id:'bag_wheel', n:'바퀴 달린 장바구니', p:18000, c:'#D9822B', info:['바퀴가 있어 끌고 다닌다','뼈대가 튼튼하다'], r:'무거운 걸 담아도 끌기만 하면 돼서 편해요.', a:{tough:3,light:3,design:1,func:3,eco:2}, later:'한 달 뒤, 무를 잔뜩 사도 끌고 오셔서 무릎이 덜 아프시대요.'},
      {id:'bag_cloth', n:'접이식 천 가방', p:9000, c:'#5DA9A0', info:['접으면 주머니에 쏙 들어간다','재활용 천으로 만들었다'], r:'가볍지만 많이 담으면 어깨가 아파요.', a:{tough:2,light:2,design:2,func:2,eco:3}, later:'한 달 뒤, 가방은 가볍지만 장을 많이 보시면 어깨가 아프시대요.'},
      {id:'bag_plastic', n:'비닐봉지 묶음', p:3000, c:'#C7D3D8', info:['아주 싸다','한두 번 쓰면 찢어지기 쉽다'], r:'금방 찢어져요.', a:{tough:1,light:3,design:1,func:1,eco:1}, later:'한 달 뒤, 봉지가 찢어져서 달걀을 깨뜨리셨대요.'},
      {id:'bag_luxury', n:'가죽 명품 가방', p:26000, c:'#6B3E26', info:['유명 브랜드 가방','고급스럽고 무겁다'], r:'멋지지만 무거워요.', a:{tough:3,light:1,design:3,func:1,eco:1}, later:''},
    ]},
  { id:'seoyeon', who:'환경 동아리 서연 언니', item:'물병', budget:15000, want:['eco','light'],
    say:['나 요즘 일회용 페트병 쓰레기를 줄이는 중이야.','매일 가방에 넣고 다녀야 해서 가벼우면 좋겠어.'],
    color:'#4BAA5B', goods:[
      {id:'bottle_water', n:'생수 20병 묶음', p:6000, c:'#7EC8E3', info:['바로 마실 수 있다','다 마시면 페트병 쓰레기가 나온다'], r:'편한데 쓰레기가 많이 나와요.', a:{tough:1,light:1,design:1,func:1,eco:1}, later:'한 달 뒤, 베란다에 페트병이 산더미처럼 쌓였대요.'},
      {id:'bottle_steel', n:'스테인리스 텀블러', p:12000, c:'#8C979D', info:['아주 오래 쓸 수 있다','차가움이 오래간다','조금 무겁다'], r:'10년은 쓸 것 같아요.', a:{tough:3,light:1,design:2,func:3,eco:3}, later:'한 달 뒤, 페트병은 안 사지만 가방이 무거워서 어깨가 아프대요.'},
      {id:'bottle_light', n:'가벼운 재사용 물병', p:9000, c:'#9BD27A', info:['씻어서 다시 쓰는 물병','아주 가볍다'], r:'가볍고 가방에 쏙 들어가요.', a:{tough:2,light:3,design:2,func:1,eco:3}, later:'한 달 뒤, 매일 들고 다니면서 페트병을 하나도 안 샀대요.'},
      {id:'bottle_char', n:'캐릭터 대용량 물병', p:18000, c:'#F2A541', info:['큰 캐릭터 그림','2리터나 들어간다'], r:'귀엽지만 너무 커요.', a:{tough:2,light:1,design:3,func:2,eco:2}, later:''},
    ]},
  { id:'jiho', who:'그림 좋아하는 동생 지호', item:'색연필', budget:12000, want:['func','price'],
    say:['나 그림 그릴 때 색이 많아야 예쁘게 칠할 수 있어!','엄마가 만 이천 원만 주셨어. 남으면 스케치북도 사고 싶어.'],
    color:'#E8B730', goods:[

let AC=null;
function beep(f=660, d=.08, type='square', vol=.05){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol; o.connect(g); g.connect(AC.destination); const t=AC.currentTime;
    g.gain.exponentialRampToValueAtTime(.0001, t+d); o.start(t); o.stop(t+d); }catch(e){}
}

/* =========================================================
   배경음악: assets/bgm.mp3 가 있으면 그 파일, 없으면 코드로 만든 8비트 마트 음악
   ========================================================= */
const bgm = (()=>{
  let started=false, muted=false, file=null, master=null, iv=null, step=0, nextT=0, fast=false;
  const MEL=[0,null,4,7, 9,null,7,4, 5,null,9,null, 7,4,2,null, 4,null,7,12, 11,null,9,7, 5,null,4,2, 0,null,null,null];
  const ROOT=[0,-3,-7,-5];                                    // C - Am - F - G
  const mel = n => 523.25*Math.pow(2,n/12), bass = n => 130.81*Math.pow(2,n/12);
  function note(f,t,d,type,vol){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02); }
  function synth(){
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:.55; master.connect(AC.destination);
    nextT=AC.currentTime+.1;
    iv=setInterval(()=>{
      const sd = 60/(fast?172:128)/4;
      while(nextT < AC.currentTime+.12){
        const i=step%32, chord=ROOT[Math.floor(i/8)];
        if(MEL[i]!=null) note(mel(MEL[i]), nextT, sd*1.6, 'square', .045);
        if(i%4===0) note(bass(chord), nextT, sd*2.6, 'triangle', .12);
        if(i%4===2) note(bass(chord+12), nextT, sd*1.4, 'triangle', .07);
        if(i%2===0) note(fast?3800:3000, nextT, .025, 'square', fast?.018:.01);
        nextT+=sd; step++;
      }
    },25);
  }
  return {
    start(){ if(started) return; started=true;
      file=new Audio('assets/bgm.mp3'); file.loop=true; file.volume=.45;
      file.addEventListener('error', ()=>{ file=null; synth(); }, {once:true});
      file.play().catch(()=>{ if(file){ file=null; synth(); } });
    },
    hurry(on){ fast=on; if(file) file.playbackRate = on?1.15:1; },
    toggle(){ muted=!muted; if(file) file.muted=muted; if(master) master.gain.value=muted?0:.55; return muted; },
  };
})();

const NPCS=[];

function spawnNPCs(n){
  NPCS.length=0;
  const lanes=[{k:'h',y:236},{k:'h',y:372},{k:'v',x:180},{k:'h',y:236},{k:'h',y:372},{k:'v',x:180}];
  for(let i=0;i<n;i++){

    NPCS.push(L.k==='h' ? {k:'h', x:30+Math.random()*300, y:L.y, vx:(Math.random()<.5?-1:1)*sp, vy:0, c:NPC_COLORS[i%6], t:Math.random()*9, wait:0}
                        : {k:'v', x:L.x, y:130+Math.random()*250, vx:0, vy:(Math.random()<.5?-1:1)*sp, c:NPC_COLORS[i%6], t:Math.random()*9, wait:0});
  }
}
function updateNPCs(dt, canHit){
  NPCS.forEach(n=>{
    n.t+=dt;
    if(n.wait>0){ n.wait-=dt; return; }
    if(Math.random()<0.003) n.wait=0.6+Math.random()*1.2;          // 물건 고르느라 잠깐 멈춤
    if(Math.random()<0.002){ n.vx=-n.vx; n.vy=-n.vy; }               // 갑자기 돌아섬
    n.x+=n.vx*dt; n.y+=n.vy*dt;
    if(n.k==='h' && (n.x<22||n.x>338)){ n.vx=-n.vx; n.x=Math.max(22,Math.min(338,n.x)); }
    if(n.k==='v' && (n.y<128||n.y>392)){ n.vy=-n.vy; n.y=Math.max(128,Math.min(392,n.y)); }
    if(canHit && P.inv<=0 && Math.hypot(P.x-n.x,P.y-n.y) < P.r+12) bump(n);
  });
}
function bump(n){
  P.inv=1.3; G.left=Math.max(0,G.left-3); sfx.bad(); shake();
  const a=Math.atan2(P.y-n.y,P.x-n.x); for(let k=0;k<6;k++){ const nx=P.x+Math.cos(a)*4, ny=P.y+Math.sin(a)*4; if(!blocked(nx,ny)){P.x=nx;P.y=ny;} }
  n.wait=0.8;
  const r=$('world').getBoundingClientRect(), g=$('game').getBoundingClientRect();
  floatText('쿵! -3초', (P.x)*S-30, (P.y-cam.y)*S-60);
}
function drawNPC(n,t){

  ctx.fillStyle='rgba(42,33,28,.2)'; ctx.beginPath(); ctx.ellipse(n.x,n.y+12,13,4.5,0,0,7); ctx.fill();

  ctx.fillStyle='#2A211C'; ctx.beginPath(); ctx.arc(cx-6,cy+9,2,0,7); ctx.arc(cx+6,cy+9,2,0,7); ctx.fill();
  // 사람
  ctx.fillStyle=n.c; ctx.beginPath(); ctx.ellipse(n.x,n.y+3-bob,11,10,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#F7D2B0'; ctx.beginPath(); ctx.arc(n.x,n.y-11-bob,9,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4A3528'; ctx.beginPath(); ctx.arc(n.x,n.y-14-bob,9,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  if(n.wait>0){ ctx.fillStyle='#fff'; rr(n.x-10,n.y-40,20,16,6); ctx.fill(); ctx.stroke(); ctx.fillStyle='#2A211C'; ctx.font='12px Jua, sans-serif'; ctx.textAlign='center'; ctx.fillText('…',n.x,n.y-32); }

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawWorld(t){
  const top = Math.max(-118, Math.min(MAP.h - VH + 170, P.y - VH*0.55));
  cam.y += (top - cam.y)*0.15;
  ctx.save(); ctx.translate(0,-cam.y);
  // 바닥
  if(IMG.floor){ const pat=ctx.createPattern(IMG.floor,'repeat'); ctx.fillStyle=pat; ctx.fillRect(0,0,MAP.w,MAP.h+200); }
  else{
    ctx.fillStyle='#F4E7CF'; ctx.fillRect(0,0,MAP.w,MAP.h+200);
    for(let y=0;y<MAP.h+200;y+=30) for(let x=0;x<MAP.w;x+=30){ if(((x+y)/30)%2===0){ ctx.fillStyle='#EEDDBE'; ctx.fillRect(x,y,30,30);} }
  }
  // 벽과 간판
  ctx.fillStyle='#12A08A'; ctx.fillRect(0,0,MAP.w,96);
  ctx.fillStyle='#0B6F60'; ctx.fillRect(0,88,MAP.w,8);
  for(let i=0;i<9;i++){ ctx.fillStyle=i%2?'#FFF9EE':'#E5484D'; ctx.beginPath(); ctx.moveTo(i*40,96); ctx.lineTo(i*40+40,96); ctx.lineTo(i*40+20,112); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='#FFF9EE'; rr(70,26,220,44,12); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#2A211C'; ctx.stroke();
  ctx.fillStyle='#2A211C'; ctx.font='22px Jua, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('우리 동네 마트 · '+C().item, 180, 49);
  // 진열대
  SHELVES.forEach((b,i)=>{
    const g=C().goods[i], hot=near&&near.type==='shelf'&&near.i===i;
    ctx.fillStyle='rgba(42,33,28,.18)'; rr(b.x+4,b.y+8,b.w,b.h,10); ctx.fill();
    ctx.fillStyle=hot?'#FFC93C':'#B8875A'; rr(b.x,b.y,b.w,b.h,10); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#2A211C'; ctx.stroke();
    ctx.fillStyle='#E9C58F'; rr(b.x+6,b.y+6,b.w-12,b.h-16,6); ctx.fill();
    for(let k=0;k<3;k++){
      const px=b.x+14+k*34, py=b.y+8 - (hot? Math.abs(Math.sin(t/180+k))*3 : 0);
      if(IMG[g.id]) drawFit(IMG[g.id], px+13, py+26, 34, 34);
      else { ctx.fillStyle=g.c; rr(px,py,26,24,5); ctx.fill(); ctx.strokeStyle='#2A211C'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.45)'; ctx.fillRect(px+4,py+4,8,4); }
    }
    // 가격표
    const tag=won(g.p); ctx.font='bold 13px "Gowun Dodum", sans-serif'; const tw=ctx.measureText(tag).width+16;
    ctx.fillStyle='#FFC93C'; rr(b.x+b.w/2-tw/2,b.y+b.h-6,tw,20,6); ctx.fill(); ctx.strokeStyle='#2A211C'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#2A211C'; ctx.fillText(tag, b.x+b.w/2, b.y+b.h+4);
    // 이름
    ctx.font='15px Jua, sans-serif'; ctx.fillStyle='#2A211C'; ctx.fillText(g.n.length>8?g.n.slice(0,8)+'…':g.n, b.x+b.w/2, b.y-12);
    if(G.seen.has(i)){ ctx.fillStyle='#12A08A'; ctx.beginPath(); ctx.arc(b.x+b.w-6,b.y-2,10,0,7); ctx.fill(); ctx.strokeStyle='#2A211C'; ctx.lineWidth=2.5; ctx.stroke(); ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.fillText('✓',b.x+b.w-6,b.y-1); }
    if(G.cart===i){ ctx.fillStyle='#E5484D'; rr(b.x-6,b.y-10,38,18,6); ctx.fill(); ctx.strokeStyle='#2A211C'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='#fff'; ctx.font='bold 11px "Gowun Dodum", sans-serif'; ctx.fillText('담음', b.x+13, b.y-1); }
  });
  // 계산대
  const c=COUNTER, chot=near&&near.type==='counter';
  ctx.fillStyle='rgba(42,33,28,.18)'; rr(c.x+4,c.y+8,c.w,c.h,10); ctx.fill();
  ctx.fillStyle=chot?'#FFC93C':'#E5484D'; rr(c.x,c.y,c.w,c.h,10); ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle='#2A211C'; ctx.stroke();
  ctx.fillStyle='#FFF9EE'; ctx.font='17px Jua, sans-serif'; ctx.fillText('계산대', c.x+c.w/2, c.y+c.h/2+1);
  // 손님 (계산대 옆에서 기다림)
  drawCustomerTop(c.x+c.w+26, c.y+16, t);
  // 문
  ctx.fillStyle='#BFE6F2'; rr(DOOR.x,DOOR.y,DOOR.w,DOOR.h,4); ctx.fill(); ctx.strokeStyle='#2A211C'; ctx.lineWidth=3; ctx.stroke();
  // 다른 손님들
  if(G.phase==='shop'||G.phase==='result') NPCS.forEach(n=>drawNPC(n,t));
  // 플레이어 (부딪힌 직후 깜빡임)
  if(!(P.inv>0 && Math.floor(t/90)%2)) drawPlayer(t);
  // 근처 안내 화살표
  if(near && G.phase==='shop'){
    const tx = near.type==='shelf' ? SHELVES[near.i].x+SHELVES[near.i].w/2 : COUNTER.x+COUNTER.w/2;
    const ty = (near.type==='shelf' ? SHELVES[near.i].y : COUNTER.y) - 30 + Math.sin(t/150)*4;
    ctx.fillStyle='#FFF9EE'; ctx.strokeStyle='#2A211C'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(tx-9,ty-10); ctx.lineTo(tx+9,ty-10); ctx.lineTo(tx,ty); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawPlayer(t){
  const bob = moving ? Math.sin(P.step)*2 : 0;
  // 걸음: 통통 뛰는 높이, 좌우 기울기, 착지할 때 찌그러짐
  const hop = moving ? Math.abs(Math.sin(P.step))*6 : Math.sin(t/450)*0.8;
  const tilt = moving ? Math.sin(P.step)*0.13 : 0;
  const squash = moving ? 1 - (1-Math.abs(Math.sin(P.step)))*0.09 : 1 + Math.sin(t/450)*0.012;
  // 발자국 먼지
  const phase = Math.floor(P.step/Math.PI);
  if(moving && phase!==P.lastPhase){ P.lastPhase=phase; DUST.push({x:P.x+(Math.random()*8-4), y:P.y+P.r+1, life:1}); }
  DUST.forEach(d=>{ d.life-=0.04; ctx.fillStyle=`rgba(255,249,238,${Math.max(0,d.life)*0.9})`; ctx.strokeStyle=`rgba(42,33,28,${Math.max(0,d.life)*0.35})`; ctx.lineWidth=1.5;
    const r=3+(1-d.life)*6; ctx.beginPath(); ctx.arc(d.x,d.y-(1-d.life)*4,r,0,7); ctx.fill(); ctx.stroke(); });
  for(let i=DUST.length-1;i>=0;i--) if(DUST[i].life<=0) DUST.splice(i,1);
  const sw = P.r*(1 - hop*0.04);
  ctx.fillStyle='rgba(42,33,28,.22)'; ctx.beginPath(); ctx.ellipse(P.x,P.y+P.r+1,sw,4.5,0,0,7); ctx.fill();
  if(IMG.player){
    const flip = Math.cos(P.dir)<-0.2 ? -1 : (Math.cos(P.dir)>0.2 ? 1 : (P.flip||1)); P.flip=flip;
    ctx.save(); ctx.translate(P.x, P.y+P.r+2-hop); ctx.rotate(tilt); ctx.scale(flip/squash*1, squash);
    drawFit(IMG.player, 0, 0, 40, 62); ctx.restore();
    if(G.cart!=null){ const g=C().goods[G.cart]; if(IMG[g.id]) drawFit(IMG[g.id], P.x+14*flip, P.y+12-hop, 22, 22); }
    return;
  }
  // 몸(앞치마)
  ctx.lineWidth=3; ctx.strokeStyle='#2A211C';
  ctx.fillStyle='#12A08A'; ctx.beginPath(); ctx.ellipse(P.x,P.y+2+bob,P.r,P.r-1,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#FFF9EE'; ctx.fillRect(P.x-5,P.y+bob,10,9);
  // 머리
  ctx.fillStyle='#F7D2B0'; ctx.beginPath(); ctx.arc(P.x,P.y-13+bob,11,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#3A2A20'; ctx.beginPath(); ctx.arc(P.x,P.y-16+bob,11,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  const ex=Math.cos(P.dir)*3, ey=Math.sin(P.dir)*2;
  ctx.fillStyle='#2A211C'; ctx.beginPath(); ctx.arc(P.x-4+ex,P.y-12+bob+ey,1.8,0,7); ctx.arc(P.x+4+ex,P.y-12+bob+ey,1.8,0,7); ctx.fill();
  // 장바구니
  if(G.cart!=null){ const g=C().goods[G.cart]; if(IMG[g.id]) ctx.drawImage(IMG[g.id],P.x+6,P.y-4+bob,20,20); else { ctx.fillStyle=g.c; rr(P.x+8,P.y-2+bob,14,12,3); ctx.fill(); ctx.stroke(); } }
}
function drawCustomerTop(x,y,t){
  const c=C(), bob=Math.sin(t/400)*1.5;
  ctx.fillStyle='rgba(42,33,28,.2)'; ctx.beginPath(); ctx.ellipse(x,y+14,11,4,0,0,7); ctx.fill();
  if(IMG[c.id]){ ctx.save(); ctx.beginPath(); ctx.arc(x,y-4+bob,15,0,7); ctx.clip(); ctx.drawImage(IMG[c.id],x-15,y-19+bob,30,30); ctx.restore(); ctx.lineWidth=3; ctx.strokeStyle='#2A211C'; ctx.beginPath(); ctx.arc(x,y-4+bob,15,0,7); ctx.stroke(); return; }
  ctx.lineWidth=3; ctx.strokeStyle='#2A211C'; ctx.fillStyle=c.color; ctx.beginPath(); ctx.ellipse(x,y+4+bob,11,10,0,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#F7D2B0'; ctx.beginPath(); ctx.arc(x,y-10+bob,10,0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = c.id==='grandma' ? '#D9D9D9' : '#3A2A20'; ctx.beginPath(); ctx.arc(x,y-13+bob,10,Math.PI*1.05,Math.PI*1.95); ctx.fill();
  // 말풍선(재촉)
  if(G.phase==='shop' && G.left<12){ ctx.fillStyle='#fff'; rr(x-16,y-48,32,22,8); ctx.fill(); ctx.stroke(); ctx.fillStyle='#E5484D'; ctx.font='16px Jua, sans-serif'; ctx.fillText('!!',x,y-37); }
}

let keys={}, joy={x:0,y:0}, near=null, moving=false;
const KEYMAP={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{ if(G.phase!=='shop'||$('layer').innerHTML) return; if(KEYMAP[e.code]){keys[KEYMAP[e.code]]=true;e.preventDefault();} if(e.code==='Space'||e.code==='Enter'){e.preventDefault();act();} });
addEventListener('keyup',e=>{ if(KEYMAP[e.code]) keys[KEYMAP[e.code]]=false; });
(function stick(){
  const el=$('stick'), knob=$('knob'); let id=null;
  const set=(cx,cy)=>{ const r=el.getBoundingClientRect(); let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2); const m=Math.hypot(dx,dy), max=r.width/2-20;
    if(m>max){dx=dx/m*max;dy=dy/m*max;} knob.style.transform=`translate(${dx}px,${dy}px)`; joy.x=dx/max; joy.y=dy/max; };
  el.addEventListener('pointerdown',e=>{ id=e.pointerId; el.setPointerCapture(id); set(e.clientX,e.clientY); });
  el.addEventListener('pointermove',e=>{ if(e.pointerId===id) set(e.clientX,e.clientY); });
  const end=()=>{ id=null; joy.x=joy.y=0; knob.style.transform=''; };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
})();
$('abtn').addEventListener('click', ()=>act());
$('mute').addEventListener('click', ()=>{ const m=bgm.toggle(); $('mute').textContent=m?'♪×':'♪'; $('mute').setAttribute('aria-label', m?'배경음악 켜기':'배경음악 끄기'); });

const hit=(x,y,r,b)=>{ const cx=Math.max(b.x,Math.min(x,b.x+b.w)), cy=Math.max(b.y,Math.min(y,b.y+b.h)); return (x-cx)**2+(y-cy)**2<r*r; };
const blocked=(x,y)=> x<P.r+6 || x>MAP.w-P.r-6 || y<120 || y>MAP.h-P.r || [...SHELVES,COUNTER].some(b=>hit(x,y,P.r,b));

/* =========================================================
   루프
   ========================================================= */
let last=performance.now(), lastTick=99;
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  if(G.phase==='shop' && !$('layer').innerHTML){
    let vx=joy.x+((keys.r?1:0)-(keys.l?1:0)), vy=joy.y+((keys.d?1:0)-(keys.u?1:0));
    const m=Math.hypot(vx,vy); moving=m>.15;
    if(moving){ if(m>1){vx/=m;vy/=m;} const sp=150*dt; if(!blocked(P.x+vx*sp,P.y)) P.x+=vx*sp; if(!blocked(P.x,P.y+vy*sp)) P.y+=vy*sp; P.dir=Math.atan2(vy,vx); P.step+=dt*13; }
    updateNPCs(dt, true); if(P.inv>0) P.inv-=dt;
    G.left-=dt;
    const s=Math.ceil(G.left); $('sec').textContent=Math.max(0,s);
    $('timer').classList.toggle('hurry', G.left<10);
    if(G.left<10 && s!==lastTick){ lastTick=s; sfx.tick(); }
    if(G.left<=0){ G.left=0; finishCustomer(true); }
  } else { moving=false; if(G.phase==='shop') updateNPCs(dt,false); }
  if(G.phase==='shop') bgm.hurry(G.left<10);
  near=null;
  if(G.phase==='shop'){
    SHELVES.forEach((b,i)=>{ if(hit(P.x,P.y,P.r+18,b)) near={type:'shelf',i}; });
    if(hit(P.x,P.y,P.r+18,COUNTER)) near={type:'counter'};
    const ab=$('abtn');
    if(!near){ ab.className='abtn off'; ab.textContent='진열대로'; }
    else if(near.type==='counter'){ ab.className='abtn pay'; ab.textContent='계산'; }
    else { ab.className='abtn'; ab.textContent='살펴보기'; }
  }
  drawWorld(t);
  requestAnimationFrame(loop);
}

function banner(txt){ const el=document.createElement('div'); el.className='banner'; el.textContent=txt; $('game').appendChild(el); setTimeout(()=>el.remove(),1100); }
function toast(txt){ document.querySelectorAll('.toast').forEach(e=>e.remove()); const el=document.createElement('div'); el.className='toast'; el.textContent=txt; $('game').appendChild(el); setTimeout(()=>el.remove(),1800); }
function addScore(n, label){ G.score+=n; $('score').textContent=G.score; const r=$('score').getBoundingClientRect(), g=$('game').getBoundingClientRect(); floatText('+'+n+(label?' '+label:''), r.left-g.left-30, r.top-g.top+30); sfx.coin(); }

function startGame(){ pickRound(); G.ci=0; G.score=0; G.log=[]; meet(); }
function meet(){
  const c=C(); G.phase='meet'; G.picks=[]; G.seen=new Set(); G.cart=null; G.left=SHOP_TIME; P.x=180; P.y=500; showPlay(false);
  const render=()=>{
    setLayer(`<div class="sheet">
      <p class="small">손님 ${G.ci+1} / ${ROUND.length} · 현재 ${G.score}점</p>
      <div class="speaker"><div class="portrait" style="${bg(c.id)}"></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span class="who">${c.who}</span><div class="bubble" id="say"></div></div></div>
      <div class="row"><span>사 올 물건 <b>${c.item}</b></span><span class="price">${won(c.budget)}</span></div>
      <p><b>손님이 중요하게 생각하는 기준 2개</b>를 골라요. 맞히면 하나에 150점!</p>
      <div class="chips">${Object.entries(CRIT).map(([k,t])=>`<button class="chip ${G.picks.includes(k)?'on':''}" data-k="${k}" aria-pressed="${G.picks.includes(k)}">${t}</button>`).join('')}</div>
      <button class="btn" id="go" ${G.picks.length===2?'':'disabled'}>마트로 출발 (${SHOP_TIME}초)</button>
    </div>`);
    $('say').textContent = c.say.join(' ');
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ sfx.tap(); const k=b.dataset.k; if(G.picks.includes(k)) G.picks=G.picks.filter(x=>x!==k); else if(G.picks.length<2) G.picks=[...G.picks,k]; render(); });
    $('go').onclick=startShop;
  };
  render();
  // 말풍선 타자 효과
  const full=c.say.join(' '), el=$('say'); el.textContent=''; let i=0; const iv=setInterval(()=>{ const e=$('say'); if(!e){clearInterval(iv);return;} e.textContent=full.slice(0,++i); if(i>=full.length) clearInterval(iv); }, 28);
}

function startShop(){
  const c=C(); sfx.ok(); G.phase='shop'; setLayer(''); showPlay(true); lastTick=99; P.inv=0; spawnNPCs(2+G.ci);
  $('budget').textContent=c.budget.toLocaleString('ko-KR'); $('score').textContent=G.score; $('sec').textContent=SHOP_TIME;
  $('miniFace').setAttribute('style', bg(c.id, 'background:'+c.color));
  $('memoWho').textContent=c.who; $('memoCrit').textContent='기준: '+G.picks.map(k=>CRIT[k].replace('?','')).join(', ');
  $('cartChip').textContent='장바구니 비어 있음';
  banner('START!');
  toast('다른 손님과 부딪히면 3초 손해! 피해서 다녀요');
}

function act(){
  if(G.phase!=='shop' || !near || $('layer').innerHTML) return;
  const c=C();
  if(near.type==='shelf'){
    const i=near.i, g=c.goods[i], first=!G.seen.has(i);
    G.seen.add(i); sfx.tap();
    if(first) addScore(25,'조사');
    setLayer(`<div class="sheet">
      <div class="goods"><div class="gimg" style="${bg(g.id,'background:'+g.c)}"></div>
        <div style="display:flex;flex-direction:column;gap:6px;min-width:0"><h2>${g.n}</h2><span class="price" style="align-self:flex-start">${won(g.p)}</span></div></div>
      <ul class="facts">${g.info.map(x=>'<li>'+x+'</li>').join('')}</ul>
      <div class="review"><b>구매 후기</b> “${g.r}”</div>
      ${g.p>c.budget?`<p class="over">손님 돈 ${won(c.budget)}보다 비싸요!</p>`:''}
      <p class="small">살펴보는 동안에도 시간이 흘러요.</p>
      <button class="btn" id="put" ${G.cart===i?'disabled':''}>${G.cart===i?'이미 담았어요':'장바구니에 담기'}</button>
      <button class="btn sub" id="close">다른 진열대 보기</button>
    </div>`);
    // 살펴보는 중에도 시간이 흐르도록 별도 타이머
    let prevT=performance.now(); const tick=setInterval(()=>{ if(!$('put')){clearInterval(tick);return;} const now=performance.now(); G.left-=(now-prevT)/1000; prevT=now; $('sec').textContent=Math.max(0,Math.ceil(G.left)); $('timer').classList.toggle('hurry', G.left<10); if(G.left<=0){ clearInterval(tick); setLayer(''); finishCustomer(true);} },200);
    $('put').onclick=()=>{ clearInterval(tick); const prev=G.cart; G.cart=i; $('cartChip').textContent='담음: '+g.n; setLayer(''); sfx.ok(); toast(prev!=null&&prev!==i?'장바구니 물건을 바꿨어요':'장바구니에 담았어요'); };
    $('close').onclick=()=>{ clearInterval(tick); setLayer(''); };
  } else {
    if(G.cart==null){ sfx.bad(); toast('장바구니가 비어 있어요'); return; }
    const g=c.goods[G.cart];
    if(g.p>c.budget){ sfx.bad(); toast('손님 예산을 넘어서 계산이 안 돼요!'); shake(); return; }
    finishCustomer(false);
  }
}
function shake(){ const el=$('game'); el.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:260}); }

function finishCustomer(timeout){
  if(G.phase!=='shop') return;
  G.phase='result'; showPlay(false);
  const c=C(), g=G.cart!=null?c.goods[G.cart]:null, valid=g&&g.p<=c.budget;
  const critHit=G.picks.filter(k=>c.want.includes(k)).length;
  const sat = valid ? satisfaction(g,c) : 0, st = valid ? starsOf(sat) : 0;
  const parts = [
    ['손님 기준 파악', critHit+' / 2', critHit*150],
    ['진열대 조사', G.seen.size+' / 4', G.seen.size*25],
    ['손님 만족', valid? sat+' / 6' : '전달 못 함', sat*100],
    ['남은 시간 보너스', valid? Math.ceil(G.left)+'초' : '-', valid? Math.ceil(G.left)*TIME_BONUS : 0],
  ];
  // 조사 점수는 이미 더했으므로 나머지만 더함
  const gain = parts[0][2] + parts[2][2] + parts[3][2];
  const thisTotal = parts.reduce((s,p)=>s+p[2],0);
  G.score += gain;
  G.log.push({who:c.who, item:valid?g.n:'-', st, pts:thisTotal});
  const face = st>=2 ? c.id+'_happy' : st===0 ? c.id+'_sad' : c.id;
  const say = !valid ? (timeout?'"시간이 다 됐어... 다음엔 꼭 부탁해."':'"아무것도 못 받았네..."')
    : st===3 ? '"우와, 내가 원하던 바로 그거야! 고마워!"' : st===2 ? '"괜찮네! 조금 아쉽지만 잘 쓸게."' : st===1 ? '"음... 내가 말한 거랑은 좀 다른데."' : '"이건 내가 원한 게 아니야."';
  if(timeout) banner('TIME UP!'); else sfx.ok();
  setTimeout(()=>{
    setLayer(`<div class="sheet">
      <div class="speaker"><div class="portrait" style="${bg(IMG[face]?face:c.id)}"></div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><span class="who">${c.who}</span><div class="bubble">${say}</div></div></div>
      <div class="stars" aria-label="만족 별 ${st}개">${'★'.repeat(st)}<span class="off">${'★'.repeat(3-st)}</span></div>
      ${valid?`<div class="later"><b>그 뒤 이야기</b><br>${g.later}</div>`:''}
      <div class="score-list">${parts.map(p=>`<div class="row"><span>${p[0]} <span class="small">${p[1]}</span></span><b>+${p[2]}</b></div>`).join('')}</div>
      <p class="small">손님의 진짜 기준: <b>${c.want.map(k=>CRIT[k].replace('?','')).join(', ')}</b></p>
      <div class="total" id="tot">${G.score - gain}</div>
      <button class="btn" id="next">${G.ci<ROUND.length-1?'다음 손님 받기':'최종 점수 보기'}</button>
    </div>`);
    countUp($('tot'), G.score-gain, G.score);
    $('next').onclick=()=>{ sfx.tap(); if(G.ci<ROUND.length-1){ G.ci++; meet(); } else final(); };
  }, timeout?1100:350);
}
function countUp(el,a,b){ const t0=performance.now(), d=900; const f=t=>{ const k=Math.min(1,(t-t0)/d); el.textContent=Math.round(a+(b-a)*k)+'점'; if(k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }

function final(){
  G.phase='final';
  const stars=G.log.reduce((s,x)=>s+x.st,0);
  const rank = G.score>=4500?'전설의 퍼스널 쇼퍼':G.score>=3300?'믿음직한 쇼퍼':G.score>=2000?'성장하는 쇼퍼':'견습 쇼퍼';
  setLayer(`<div class="sheet">
    <p class="small">사흘 영업 끝!</p>
    <h2>${rank}</h2>
    <div class="total">${G.score}점</div>
    <div class="score-list">${G.log.map(x=>`<div class="row"><span>${x.who}<br><span class="small">${x.item}</span></span><b>${'★'.repeat(x.st)||'-'}</b></div>`).join('')}</div>
    <p>랭킹에 올릴 <b>닉네임</b>을 적어요. (실명 말고 별명으로!)</p>
    <input class="name" id="nm" maxlength="8" placeholder="예: 합리왕" autocomplete="off" value="${escapeHtml(G.name)}">
    <button class="btn" id="save">랭킹에 올리기</button>
    <button class="btn sub" id="skip">올리지 않고 처음으로</button>
  </div>`, true);
  $('save').onclick=async ()=>{
    const nm=$('nm').value.trim().slice(0,8); if(!nm){ toast('닉네임을 적어 주세요'); return; }
    G.name=nm; $('save').disabled=true; $('save').textContent='올리는 중...';
    const mine = await submitScore(nm, G.score, stars);
    ranking(mine);
  };
  $('skip').onclick=title;
}

/* =========================================================
   랭킹 (Supabase, 실패하면 이 기기에만 저장)
   ========================================================= */
const H = { apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json' };
async function submitScore(name, score, stars){
  const row={name, score, stars};
  try{
    if(!SUPABASE_URL) throw new Error('no backend');
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(row)});
    if(!r.ok) throw new Error(r.status);
    const d=await r.json(); return {online:true, id:d[0]&&d[0].id, ...row};
  }catch(e){
    const list=readLocal(); const id='l'+Date.now(); list.push({id,...row}); try{localStorage.setItem(LOCAL_KEY,JSON.stringify(list));}catch(_){}
    return {online:false, id, ...row};
  }
}
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)||'[]'); }catch(e){ return []; } }
async function fetchTop(){
  try{
    if(!SUPABASE_URL) throw new Error('no backend');
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=id,name,score,stars&order=score.desc,created_at.asc&limit=10`,{headers:H});
    if(!r.ok) throw new Error(r.status); return {online:true, list:await r.json()};
  }catch(e){ return {online:false, list:readLocal().sort((a,b)=>b.score-a.score).slice(0,10)}; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
async function ranking(mine){
  G.phase='rank';
  setLayer(`<div class="sheet"><h2>대행사 랭킹</h2><p class="small">불러오는 중...</p></div>`, true);
  const {online, list} = await fetchTop();
  const inTop = mine && list.some(x=>String(x.id)===String(mine.id));
  setLayer(`<div class="sheet">
    <h2>대행사 랭킹 TOP 10</h2>
    <p class="small">${online?'우리 반 친구들과 함께 보는 랭킹이에요.':'인터넷에 연결되지 않아 이 기기의 기록만 보여요.'}</p>
    <ol class="rank">${list.length? list.map((x,i)=>`<li class="${mine&&String(x.id)===String(mine.id)?'me':''}"><span class="no">${i+1}</span><span>${escapeHtml(x.name)} <span class="small">${'★'.repeat(x.stars||0)}</span></span><span class="pt">${x.score}</span></li>`).join('') : '<li><span class="no">-</span><span>아직 기록이 없어요. 첫 번째 주인공이 되어 봐요!</span><span></span></li>'}</ol>
    ${mine && !inTop ? `<p>내 기록: <b>${escapeHtml(mine.name)} ${mine.score}점</b> (TOP 10 밖)</p>`:''}
    <button class="btn" id="again">다시 도전</button>
    <button class="btn sub" id="ref">새로고침</button>
  </div>`, true);
  $('again').onclick=()=>{ sfx.tap(); title(); };
  $('ref').onclick=()=>ranking(mine);
}

/* ========================================================= */
resize();
assetsReady.then(()=>{ title(); });
requestAnimationFrame(loop);
</script>
